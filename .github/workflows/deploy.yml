name: Deploy Frontend

on:
  push:
    branches:
      - main

permissions:
  id-token: write   # required for OIDC to AWS
  contents: read

env:
  AWS_REGION: us-west-2
  TF_DIR: terraform/environments/dev
  APP_DIR: webapp

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Build
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

      # --- Bootstrap credentials just to read Terraform outputs ---
      # Uses the same OIDC role. That role's trust policy already scopes
      # this repo, so it's safe to assume before we even know the
      # deploy-time bucket/role values.
      - name: Configure AWS credentials (bootstrap)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CICD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Read Terraform outputs
        id: tf
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "s3_bucket=$(terraform output -raw webapp_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "cloudfront_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "role_arn=$(terraform output -raw cicd_role_arn)" >> "$GITHUB_OUTPUT"

      - name: Sync build to S3
        run: |
          aws s3 sync ./${{ env.APP_DIR }}/dist s3://${{ steps.tf.outputs.s3_bucket }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.tf.outputs.cloudfront_id }} \
            --paths "/*"